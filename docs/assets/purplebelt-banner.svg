<text x="64" y="218" fill="#e1dcef" font-family="Arial, sans-serif" font-size="28">From business idea to a testable agent.</text>
<text x="65" y="256" fill="#a9a3bd" font-family="Arial, sans-serif" font-size="18">Built for GitHub Copilot. Grounded in Microsoft toolkits.</text>
